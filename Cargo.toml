# =============================================================================
#  R E P S   ·   cli-forge
# =============================================================================
[package]
name    = "cli-forge"
version = "2.0.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Unified CLI framework: runtime command registration, themed reusable output, and styled parsing through one API."

# Keywords (5 max)
keywords = ["cli", "command-line", "terminal", "framework", "color"]

# Categories
categories = ["command-line-interface", "development-tools"]

# Links
homepage      = "https://github.com/jamesgober/cli-forge"
repository    = "https://github.com/jamesgober/cli-forge"
documentation = "https://docs.rs/cli-forge"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "cli_forge"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std", "color", "unicode", "termsize"]

# Standard library: terminal detection, the stdout/stderr write paths, and the
# whole command layer. Without it the crate is its styling core — colours,
# styles, themes, markup, and text measurement — on `alloc` alone, for a sink
# whose capability the caller declares with `terminal::set_level`.
std = []

# ANSI / styled output. Disable for plain output: the API stays complete and
# every styled value renders as its plain text.
color = ["dep:enable-ansi-support"]

# Correct display widths for CJK, emoji, and combining marks, from the Unicode
# East Asian Width tables. Without it widths are counted in characters, which is
# exact for Latin/Greek/Cyrillic and wrong for the rest; help columns, padding,
# truncation, and wrapping all depend on the answer.
unicode = ["dep:unicode-width"]

# Query the real terminal for its size, so help wraps to the window rather than
# to a guess. Without it only `COLUMNS`/`LINES` are consulted.
termsize = ["dep:terminal_size"]

# Enforcement of the `requires_auth` command flag through the auth hook seam.
# Adds `App::auth` and `AuthRequest`. Implies `std` (part of the command layer).
auth = ["std"]


# DEPENDENCIES
# #################################
[dependencies]

# Display width tables. Data only — no unsafe, no transitive dependencies.
unicode-width = { version = "0.2", optional = true, default-features = false }

# Terminal dimensions. Isolated here because querying them requires FFI and the
# crate root is `#![forbid(unsafe_code)]`.
terminal_size = { version = "0.4", optional = true }

# Windows-only. Enables the console's virtual-terminal (ANSI) processing so the
# same escape-sequence backend drives Linux, macOS, and the Windows console.
# Delegated to a crate because the crate root is `#![forbid(unsafe_code)]` and
# the enable call (SetConsoleMode) requires FFI. Pulled in only by the `color`
# feature on Windows targets.
[target.'cfg(windows)'.dependencies]
enable-ansi-support = { version = "0.2", optional = true }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"

[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"


# BENCHMARKS
# #################################
[[bench]]
name             = "bench"
harness          = false
required-features = ["std"]


# EXAMPLES
# #################################
# Examples exercise the public output and command APIs, which are gated on
# `std`; declaring the requirement skips them cleanly under
# `--no-default-features`.
[[example]]
name             = "quick_start"
required-features = ["std"]

[[example]]
name             = "four_paths"
required-features = ["std"]

[[example]]
name             = "theme"
required-features = ["std"]

[[example]]
name             = "colors"
required-features = ["std"]

[[example]]
name             = "status_report"
required-features = ["std"]

[[example]]
name             = "commands"
required-features = ["std"]

[[example]]
name             = "arguments"
required-features = ["std"]

[[example]]
name             = "auth"
required-features = ["auth"]


# INTEGRATION TESTS
# #################################
# The command layer and the output paths need `std`; without it there is nothing
# for these to exercise.
[[test]]
name             = "registration"
required-features = ["std"]

[[test]]
name             = "allocation"
required-features = ["std"]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
